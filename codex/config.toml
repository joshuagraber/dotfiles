model = "gpt-5-codex"
approvalMode = "suggest"
fullAutoErrorMode = "ask-user"

networkAccess = "Enabled"      

[mcp_servers.github]
command = "zsh"
args = ["-lc", "source ~/.localrc && docker run -i --rm -e GITHUB_PERSONAL_ACCESS_TOKEN -e GITHUB_TOOLSETS=repos,issues,pull_requests,context ghcr.io/github/github-mcp-server:latest stdio"]

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp_servers.serena]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server"]

